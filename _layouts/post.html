---
layout: default
---
<article class="academia-block">
    <h1>{{ page.title }}</h1>
    <p style="font-family: var(--font-headings); color: var(--metal-light); margin-bottom: 2rem;">
        {{ page.date | date: "%B %d, %Y" }} | {{ page.categories | join: ", " }}
    </p>
    {{ content }}
</article>
